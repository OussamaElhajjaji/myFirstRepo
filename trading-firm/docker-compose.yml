version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python -m uvicorn api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./portfolio_data:/app/portfolio_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  agent-loop:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python main_loop.py
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./portfolio_data:/app/portfolio_data
    depends_on:
      - api
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.node
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  logs:
  portfolio_data:
